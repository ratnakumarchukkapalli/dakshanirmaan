# Daily encrypted copy of the books. Not configured yet: a manual run (workflow_dispatch) warns and stops so it
# can be switched on step by step; a SCHEDULED run with a missing secret FAILS, so a deleted or rotated secret
# can never leave a green run and no backup.
# Needs two repository secrets (Settings > Secrets and variables > Actions), described in RUNBOOK.md:
#   DATABASE_URL     the Supabase *session pooler* connection string (postgres.<ref>@...pooler.supabase.com:5432).
#                    Not the direct host: GitHub's runners have no IPv6 and the free direct host is IPv6-only.
#   AGE_PUBLIC_KEY   the family's age public key (age1...). The private half is never stored here.
# Optional repository VARIABLE (not a secret): EXPECTED_AGE_RECIPIENT_SHA256, the sha256 of the right public key
# (RUNBOOK 2.1). When set, a wrong key fails the run before anything is encrypted.
# The encrypted file is kept as a private workflow artifact for 30 days. The off-GitHub copy (family
# Google Drive) is a later step; see RUNBOOK.md, "Switching on the Drive copy".
# SWITCH-ON STEPS (backups are OFF until the owner does these; details in RUNBOOK.md section 2.1 and the
# go-live checklist in section 12; source: docs/reviews/2026-10-final-security-pass.md, owner action 5):
#   1. On a trusted computer: `age-keygen -o ~/family-age-key.txt`. Keep TWO copies of that file, both OUTSIDE the repository.
#   2. GitHub -> Settings -> Secrets and variables -> Actions -> Secrets: AGE_PUBLIC_KEY (the age1... line) and
#      DATABASE_URL (Supabase *session pooler* URI, ending ?sslmode=require).
#   3. Same page -> Variables: EXPECTED_AGE_RECIPIENT_SHA256 (sha256 of the public key) and ALLOW_EMPTY_BACKUP=1
#      (only until the opening balances are posted).
#   4. Uncomment the `schedule:` lines below and commit.
#   5. Actions -> Backup -> Run workflow once. Download the artifact, run scripts/backup/restore-drill.sh on it (RUNBOOK 2.3).
#   6. When the opening balances are posted: DELETE the ALLOW_EMPTY_BACKUP variable.
#   7. Year-end: download the FY archive ZIP (Settings -> Export & backup) and keep it offline.
# OPTIONAL bill-photo copy (private `docs` bucket): set the repository variable BACKUP_STORAGE=1 plus the variable
# SUPABASE_PROJECT_REF and the secret SUPABASE_ACCESS_TOKEN (a Supabase personal access token). Default OFF: the bucket is empty today.
# Every `uses:` below is pinned to a full commit SHA (tag in the trailing comment); Dependabot proposes updates.
name: Backup

# SWITCHED OFF (owner decision, Ratna 2026-10-01): no scheduled run until the backup is wanted. To switch it on
# again, restore the schedule below and set the two secrets (RUNBOOK.md 2.1). A manual run still works.
on:
  # schedule:
  #   - cron: '30 20 * * *'     # 02:00 India time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    name: Dump, verify, encrypt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Is the backup configured?
        id: cfg
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$AGE_PUBLIC_KEY" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::warning title=Backup not configured::Set the DATABASE_URL and AGE_PUBLIC_KEY repository secrets (see RUNBOOK.md). Nothing was backed up."
              echo "ready=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error title=Backup not configured::DATABASE_URL or AGE_PUBLIC_KEY is missing, so NO backup was made (event: $EVENT_NAME). Restore the repository secret (RUNBOOK.md 2.1)."
              exit 1
            fi
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.cfg.outputs.ready == 'true'
        with:
          persist-credentials: false
      - name: Install age and the PostgreSQL 17 client
        if: steps.cfg.outputs.ready == 'true'
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y age postgresql-client-17
      - name: Dump, check and encrypt
        if: steps.cfg.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AGE_RECIPIENT: ${{ secrets.AGE_PUBLIC_KEY }}
          EXPECTED_AGE_RECIPIENT_SHA256: ${{ vars.EXPECTED_AGE_RECIPIENT_SHA256 }}
          ALLOW_EMPTY_BACKUP: ${{ vars.ALLOW_EMPTY_BACKUP }}   # set to 1 ONLY until the opening balances are posted
        run: scripts/backup/dump.sh backups
      - name: Keep the encrypted file
        # Only after a fully successful dump; each run uploads under its own name, so a failed run
        # can never replace an earlier good artifact.
        if: success() && steps.cfg.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dn-backup-${{ github.run_id }}
          path: backups/dn-backup-*.tar.age
          retention-days: 30
          if-no-files-found: error
      # OPT-IN second copy: the bill photos in the private `docs` bucket. After the database artifact is kept, so a
      # storage problem can never cost that day's database backup (it still turns the run red).
      - name: Set up the Supabase CLI (bill-photo copy only)
        if: success() && steps.cfg.outputs.ready == 'true' && vars.BACKUP_STORAGE == '1'
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.117.0
      - name: Copy and encrypt the bill photos
        if: success() && steps.cfg.outputs.ready == 'true' && vars.BACKUP_STORAGE == '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          AGE_RECIPIENT: ${{ secrets.AGE_PUBLIC_KEY }}
          EXPECTED_AGE_RECIPIENT_SHA256: ${{ vars.EXPECTED_AGE_RECIPIENT_SHA256 }}
          ALLOW_EMPTY_BACKUP: ${{ vars.ALLOW_EMPTY_BACKUP }}   # an empty bucket passes only while this is 1
        run: scripts/backup/storage-copy.sh backups
      - name: Keep the encrypted bill photos
        if: success() && steps.cfg.outputs.ready == 'true' && vars.BACKUP_STORAGE == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dn-storage-${{ github.run_id }}
          path: backups/dn-storage-*.tar.age
          retention-days: 30
          if-no-files-found: error
