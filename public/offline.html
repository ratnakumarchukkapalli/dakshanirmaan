<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · Daksha Nirmaan Traders</title>
<style>
  :root{color-scheme:light dark;--bg:#E9EDF2;--ink:#1B2028;--muted:#5A6472;--card:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#0E1116;--ink:#E7EAEF;--muted:#98A1AD;--card:#1D2128}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);
    font-family:"Avenir Next",-apple-system,"SF Pro Text","Segoe UI",Roboto,"Noto Sans","Noto Sans Telugu",sans-serif}
  main{max-width:420px;background:var(--card);border-radius:22px;padding:26px 24px;box-shadow:0 10px 30px -12px rgba(0,0,0,.25)}
  h1{font-size:21px;margin:0 0 8px} p{color:var(--muted);line-height:1.5;margin:0 0 10px}
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>Daksha Nirmaan needs an internet connection to save anything, so nothing can be recorded right now.</p>
  <p><b>Keep billing in the manual invoice book.</b> Enter those bills here once you are back online.</p>
  <p>దయచేసి ఇంటర్నెట్ వచ్చే వరకు మాన్యువల్ ఇన్వాయిస్ బుక్‌లో బిల్లులు రాయండి.</p>
</main>
</body>
</html>
